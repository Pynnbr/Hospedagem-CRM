<body class="min-h-screen antialiased">
<div class="mx-auto max-w-6xl px-4 py-6">
  <header class="mb-6 flex items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold text-emerald-800">Reservas diretas</h1>
      <p class="text-sm text-slate-500">Responda rápido e feche sem comissão de OTA.</p>
    </div>
    <button id="add" class="shrink-0 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-emerald-500">Nova consulta</button>
  </header>

  <section id="stats" class="mb-6 grid grid-cols-2 gap-2 sm:gap-3 lg:grid-cols-4"></section>

  <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
    <div id="chips" class="-mx-4 flex gap-1.5 overflow-x-auto px-4 pb-1 md:mx-0 md:flex-wrap md:overflow-visible md:px-0 md:pb-0"></div>
    <input id="q" placeholder="Buscar por nome, telefone, quarto ou data" type="search" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none md:w-72">
  </div>

  <div id="cards" class="grid gap-3 md:hidden"></div>
  <div id="table" class="hidden overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm md:block"></div>
  <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-sm text-slate-500">
    <span id="count"></span>
    <div class="flex items-center gap-3">
      <button id="prev" class="rounded-md px-2 py-1 hover:bg-emerald-50 disabled:opacity-30">Anterior</button>
      <span id="pg"></span>
      <button id="next" class="rounded-md px-2 py-1 hover:bg-emerald-50 disabled:opacity-30">Próxima</button>
    </div>
  </div>
  <p class="mt-8 text-xs text-slate-500">Demonstração: os dados ficam salvos neste navegador. Para persistir no Supabase, use o projeto React com supabase.sql.</p>
</div>

<div id="modal" class="fixed inset-0 z-50 hidden items-end justify-center bg-slate-900/40 backdrop-blur-sm sm:items-center sm:p-4">
  <form id="form" class="max-h-[92vh] w-full overflow-y-auto rounded-t-2xl border border-slate-200 bg-white p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom,0px))] shadow-xl sm:max-w-lg sm:rounded-2xl">
    <div class="mb-4 flex items-center justify-between">
      <h2 id="mtitle" class="text-lg font-semibold text-slate-900"></h2>
      <button type="button" id="close" class="text-slate-500 hover:text-slate-900" aria-label="Fechar">✕</button>
    </div>
    <div class="grid gap-4 sm:grid-cols-2" id="fields"></div>
    <div class="mt-6 flex items-center justify-between">
      <button type="button" id="del" class="text-sm text-rose-600 hover:text-rose-500">Excluir</button>
      <div class="flex gap-2">
        <button type="button" id="cancel" class="rounded-lg px-4 py-2 text-sm text-slate-600 hover:bg-slate-100">Cancelar</button>
        <button class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-emerald-500">Salvar consulta</button>
      </div>
    </div>
  </form>
</div>

<script>
const ST = {
  novo:    ["Novo",           "bg-sky-100 text-sky-700 ring-sky-300"],
  cotacao: ["Cotação enviada","bg-amber-100 text-amber-800 ring-amber-300"],
  sinal:   ["Sinal pago",     "bg-violet-100 text-violet-700 ring-violet-300"],
  fechado: ["Fechado",        "bg-emerald-100 text-emerald-700 ring-emerald-300"]
};
const ROOMS = ["Standard", "Superior", "Suíte", "Família"];
const KEY = "hotel-crm-v1", PAGE = 6, H = 3600000;
const day = (n) => { const d = new Date(Date.now() + n * 86400000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const brl = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nights = (l) => Math.max(0, Math.round((new Date(l.checkout) - new Date(l.checkin)) / 86400000)) || 0;
const fmtD = (d) => (d ? d.split("-").reverse().slice(0, 2).join("/") : "—");
const stale = (l) => (l.status === "novo" || l.status === "cotacao") && Date.now() - (l.updated || l.created) > 24 * H;

let leads = [];
try { leads = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
if (!leads.length) {
  const now = Date.now();
  leads = [
    { id: 1, name: "Marina Souza",  phone: "(11) 98888-1200", checkin: day(20), checkout: day(24), guests: 2, room: "Suíte",    rate: 540, status: "fechado", created: now - 50 * H },
    { id: 2, name: "Carlos Mendes", phone: "(21) 97777-4410", checkin: day(35), checkout: day(38), guests: 4, room: "Família",  rate: 420, status: "cotacao", created: now - 30 * H },
    { id: 3, name: "Ana Beatriz",   phone: "(31) 96666-0098", checkin: day(12), checkout: day(15), guests: 2, room: "Superior", rate: 360, status: "sinal",   created: now - 8 * H },
    { id: 4, name: "Rafael Lima",   phone: "(41) 95555-7321", checkin: day(50), checkout: day(53), guests: 1, room: "Standard", rate: 280, status: "novo",    created: now - 2 * H },
    { id: 5, name: "Júlia Prado",   phone: "(71) 94444-5532", checkin: day(9),  checkout: day(11), guests: 2, room: "Standard", rate: 290, status: "novo",    created: now - 27 * H }
  ];
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(leads)); } catch (e) {} };

let filter = "todos", query = "", page = 1, editing = null;
const $ = (id) => document.getElementById(id);

const norm = (s) => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const hay = (l) => norm([l.name, l.phone, String(l.phone || "").replace(/\D/g, ""), l.room, ST[l.status][0], fmtD(l.checkin), fmtD(l.checkout), l.checkin, l.checkout, l.guests + " hospedes"].join(" "));
const hit = (l, terms) => { const h = hay(l); return terms.every((t) => h.includes(t)); };

function render() {
  const terms = norm(query).split(/\s+/).filter(Boolean);
  const total = leads.length;
  const closed = leads.filter((l) => l.status === "fechado");
  const rate = total ? Math.round((closed.length / total) * 100) : 0;
  const rev = closed.reduce((s, l) => s + nights(l) * Number(l.rate), 0);
  const late = leads.filter(stale).length;
  const card = (t, v, c) => `<div class="rounded-xl border border-slate-200 border-t-4 ${c[0]} ${c[1]} p-4 shadow-sm"><div class="mb-2 text-sm font-medium ${c[2]}">${t}</div><div class="break-words text-lg font-semibold leading-tight sm:text-2xl text-slate-900">${v}</div></div>`;
  const C = { sky: ["border-t-sky-500", "bg-sky-50", "text-sky-700"], em: ["border-t-emerald-500", "bg-emerald-50", "text-emerald-700"], vi: ["border-t-violet-500", "bg-violet-50", "text-violet-700"], am: ["border-t-amber-500", "bg-amber-50", "text-amber-700"] };
  $("stats").innerHTML =
    card("Consultas", total, C.sky) + card("Reservas fechadas", closed.length, C.em) +
    card("Taxa de conversão", rate + "%", C.vi) + card("Receita fechada", brl(rev), C.am);

  $("chips").innerHTML = ["todos", ...Object.keys(ST)].map((k) => {
    const c = leads.filter((l) => (k === "todos" || l.status === k) && hit(l, terms)).length;
    const on = filter === k;
    return `<button data-f="${k}" class="shrink-0 whitespace-nowrap rounded-full px-3 py-1.5 text-sm ${on ? "bg-emerald-600 text-white shadow-sm" : "border border-slate-200 bg-white text-slate-600 hover:border-emerald-300 hover:text-emerald-700"}">${k === "todos" ? "Todos" : ST[k][0]} <span class="ml-1 text-xs ${on ? "text-emerald-100" : "text-slate-600"}">${c}</span></button>`;
  }).join("") + (late ? `<span class="ml-1 shrink-0 self-center whitespace-nowrap text-sm text-rose-600">${late} sem retorno há mais de 24h</span>` : "");

  const list = leads.filter((l) => (filter === "todos" || l.status === filter) && hit(l, terms))
    .sort((a, b) => (b.updated || b.created) - (a.updated || a.created));
  const emptyMsg = query.trim() ? "Nenhum resultado para “" + esc(query.trim()) + "”. Tente outro nome, telefone ou data." : "Nenhuma consulta encontrada. Cadastre uma ou mude os filtros.";
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  if (page > pages) page = pages;
  const items = list.slice((page - 1) * PAGE, page * PAGE);

  $("table").innerHTML = items.length ? `<table class="w-full min-w-[720px] text-left text-sm">
    <thead class="border-b border-slate-200 bg-emerald-50 text-emerald-800"><tr>
      ${["Hóspede", "Estadia", "Quarto", "Total", "Status"].map((h) => `<th class="px-4 py-3 font-normal">${h}</th>`).join("")}
    </tr></thead><tbody class="divide-y divide-slate-100">
    ${items.map((l) => `<tr data-id="${l.id}" class="cursor-pointer hover:bg-emerald-50/60 ${stale(l) ? "bg-rose-50" : ""}">
      <td class="px-4 py-3"><div class="font-medium text-slate-900">${esc(l.name)}</div><div class="text-xs text-slate-500">${esc(l.phone)}</div></td>
      <td class="px-4 py-3 text-slate-600">${fmtD(l.checkin)} a ${fmtD(l.checkout)}<div class="text-xs text-slate-400">${nights(l)} noite(s), ${l.guests} hóspede(s)</div></td>
      <td class="px-4 py-3 text-slate-600">${esc(l.room)}<div class="text-xs text-slate-400">${brl(l.rate)} por diária</div></td>
      <td class="px-4 py-3 text-slate-700">${brl(nights(l) * Number(l.rate))}</td>
      <td class="px-4 py-3"><span class="rounded-full px-2.5 py-1 text-xs ring-1 ring-inset ${ST[l.status][1]}">${ST[l.status][0]}</span>
        ${stale(l) ? '<div class="mt-1 text-xs text-rose-600">Sem retorno há 24h+</div>' : ""}</td>
    </tr>`).join("")}</tbody></table>`
    : `<p class="py-16 text-center text-sm text-slate-500">${emptyMsg}</p>`;

  $("cards").innerHTML = items.length ? items.map((l) => `<div data-id="${l.id}" class="cursor-pointer rounded-xl border p-4 shadow-sm ${stale(l) ? "border-rose-300 bg-rose-50" : "border-slate-200 bg-white"}">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0"><div class="truncate font-medium text-slate-900">${esc(l.name)}</div><div class="text-xs text-slate-500">${esc(l.phone)}</div></div>
      <span class="shrink-0 rounded-full px-2.5 py-1 text-xs ring-1 ring-inset ${ST[l.status][1]}">${ST[l.status][0]}</span>
    </div>
    <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
      <div><div class="text-slate-700">${fmtD(l.checkin)} a ${fmtD(l.checkout)}</div><div class="text-xs text-slate-500">${nights(l)} noite(s), ${l.guests} hóspede(s)</div></div>
      <div class="text-right"><div class="font-medium text-slate-900">${brl(nights(l) * Number(l.rate))}</div><div class="text-xs text-slate-500">${esc(l.room)}</div></div>
    </div>
    ${stale(l) ? '<div class="mt-2 text-xs text-rose-600">Sem retorno há 24h+</div>' : ""}
  </div>`).join("") : `<p class="py-12 text-center text-sm text-slate-500">${emptyMsg}</p>`;

  $("count").textContent = list.length + " resultado" + (list.length !== 1 ? "s" : "");
  $("pg").textContent = page + " de " + pages;
  $("prev").disabled = page === 1;
  $("next").disabled = page === pages;
}

const field = (label, name, type = "text", val = "", extra = "", cls = "") =>
  `<label class="block ${cls}"><span class="mb-1.5 block text-sm text-slate-600">${label}</span>
   <input name="${name}" type="${type}" value="${esc(val)}" ${extra} class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-500 focus:outline-none"></label>`;
const select = (label, name, opts, val) =>
  `<label class="block"><span class="mb-1.5 block text-sm text-slate-600">${label}</span>
   <select name="${name}" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-emerald-500 focus:outline-none">
   ${opts.map(([v, t]) => `<option value="${v}" ${v === val ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;

function openModal(l) {
  editing = l || null;
  const d = l || { name: "", phone: "", checkin: day(7), checkout: day(9), guests: 2, room: "Standard", rate: "", status: "novo" };
  $("mtitle").textContent = l ? "Editar consulta" : "Nova consulta";
  $("del").style.display = l ? "block" : "none";
  $("fields").innerHTML =
    field("Nome", "name", "text", d.name, "required", "sm:col-span-2") +
    field("Telefone", "phone", "tel", d.phone, "", "sm:col-span-2") +
    field("Check-in", "checkin", "date", d.checkin, "required") +
    field("Check-out", "checkout", "date", d.checkout, "required") +
    field("Hóspedes", "guests", "number", d.guests, 'min="1"') +
    select("Tipo de quarto", "room", ROOMS.map((r) => [r, r]), d.room) +
    field("Valor da diária (R$)", "rate", "number", d.rate, 'min="0" step="0.01" required') +
    select("Status", "status", Object.keys(ST).map((k) => [k, ST[k][0]]), d.status);
  $("modal").classList.replace("hidden", "flex");
}
const closeModal = () => $("modal").classList.replace("flex", "hidden");

$("add").onclick = () => openModal();
$("close").onclick = $("cancel").onclick = closeModal;
$("modal").onmousedown = (e) => e.target === $("modal") && closeModal();
document.onkeydown = (e) => e.key === "Escape" && closeModal();
$("del").onclick = () => { if (editing && confirm("Excluir " + editing.name + "?")) { leads = leads.filter((l) => l.id !== editing.id); persist(); closeModal(); render(); } };
$("form").onsubmit = (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (f.checkout < f.checkin) { alert("O check-out precisa ser depois do check-in."); return; }
  const data = { ...f, guests: +f.guests || 1, rate: +f.rate || 0 };
  if (editing) leads = leads.map((l) => (l.id === editing.id ? { ...l, ...data, updated: Date.now() } : l));
  else leads.unshift({ id: Date.now(), created: Date.now(), updated: Date.now(), ...data });
  persist(); closeModal(); render();
};
$("chips").onclick = (e) => { const b = e.target.closest("[data-f]"); if (b) { filter = b.dataset.f; page = 1; render(); } };
const pick = (e) => { const r = e.target.closest("[data-id]"); if (r) openModal(leads.find((l) => l.id == r.dataset.id)); };
$("table").onclick = pick;
$("cards").onclick = pick;
$("q").oninput = (e) => { query = e.target.value; page = 1; render(); };
$("prev").onclick = () => { page--; render(); };
$("next").onclick = () => { page++; render(); };
render();
</script>
</body>
</html>
